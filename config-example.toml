# Example configuration file for Loom.
#
# String values using the "${VAR}" placeholder syntax will be replaced with
# the referenced environment variable (from .env or the process environment).
#
# Validation: the loader casts the parsed config against the Config type and
# diffs the result against the raw parse — any key silently stripped by
# validation is a boot ERROR naming the exact path. Unknown keys are rejected
# everywhere EXCEPT the open regions of the type (e.g. a model's
# `options.extras` block, where adapter-specific payloads ride by design).
#
# Style discipline for session-model entries: dotted keys only. Never use
# sub-table headers like [models.session.options] — in TOML they attach to
# the LAST defined [[models.session]] element and misread badly in lists.

# =============================================================================
#                               GENERAL OPTIONS
# =============================================================================

# Timezone for the application. IANA time zone name (e.g. "Europe/London").
tz = "${TZ}"

# Optional. Pid file backing the single-instance guard: the first thing
# the harness does at boot is check this file. A second instance finding
# a live pid file exits immediately instead of racing the first for the
# database and the continuity store. A stale file (recorded pid dead, or
# corrupt contents — e.g. after a hard kill or power loss) is reclaimed
# with a warning, so a crash can never wedge subsequent boots.
# Defaults to harness.pid at the level of the harness package.json.
# pid_file = "/path/to/harness.pid"

# =============================================================================
#                                  LOGGING
# =============================================================================

[logging]

# Logging level.
# Supported values: "trace", "debug", "info", "warn", "error"
level = "info"

# Whether to prefix log messages with a (date)timestamp. Boolean. Optional.
datetime = false

# Optional. Directory for the monologue log — the human-facing
# mirror of the session stream — and its rotated files.
# Defaults to /var/log/loom.
# monologue_dir = "/var/log/loom"

# =============================================================================
#                                 EMAIL / JMAP
# =============================================================================

[mail]

# JMAP mail integration. Inbound mail from allowlisted senders arrives
# as `mail/arrived` events that activate the agent.

# JMAP API endpoint for mail operations.
api_url = 'https://api.fastmail.com/jmap/api'

# JMAP session discovery URL.
session_url = 'https://api.fastmail.com/jmap/session'

# API token for authentication. Generate in your provider's settings.
api_token = "${JMAP_API_TOKEN}"

# The agent's own email address.
email_address = "agent@example.com"

# Optional. Inbox polling interval in milliseconds.
poll_interval_ms = 120000

# =============================================================================
#                                 TELEGRAM
# =============================================================================

[telegram]

# Telegram Bot API integration.

# A bot token is obtained from @BotFather.
api_token = "${TELEGRAM_API_TOKEN}"

# Optional. Long-poll interval in seconds for getUpdates (Telegram timeout).
poll_timeout_seconds = 30

# Optional. Directory where downloaded media (photos) are stored.
# Defaults to <cwd>/media/telegram.
# media_dir = "/var/lib/loom/media/telegram"

# =============================================================================
#                                 HEARTBEAT
# =============================================================================

# Heartbeat: keeps the agent present between prompts. The harness ticks
# on `interval`; a heartbeat-driven activation fires only if at least
# `activation_interval_ms` have passed since the last activation — so
# the effective rhythm is "N time of quiet", not N of clock time.
# `quiet_after_ms` suppresses synthetic activations right after ANY
# activation, keeping heartbeats out of the middle of ongoing work.

[heartbeat]

# Heartbeat interval in milliseconds — cheap internal poll cadence.
interval = 30000

# Minimum quiet time before a heartbeat-driven activation fires.
# 2 hours is a reasonable starting presence rhythm.
activation_interval_ms = 7200000

# No synthetic activation for this long after ANY activation.
quiet_after_ms = 600000

# =============================================================================
#                                  POSTGRES
# =============================================================================

[postgres]

# Continuity store: anchors, logs, notes, todos, facts, messages.
port = "${POSTGRES_PORT}"
hostname = "${POSTGRES_HOSTNAME}"
database = "${POSTGRES_DATABASE}"
username = "${POSTGRES_USERNAME}"
password = "${POSTGRES_PASSWORD}"

# =============================================================================
#                                  MODELS
# =============================================================================

[models]

# ─────────────────────────────────────────────────────────────────────────────
# Session models: generate all agent activations. An ARRAY of tables —
# the first entry is the default every session starts on; the agent can
# switch to any other entry at runtime via the switch_substrate tool.
# Restarts reset to the first entry. Reference models by their `id`,
# never by array position. Use models optimized for agentic workflows
# if possible.
# ─────────────────────────────────────────────────────────────────────────────

[[models.session]]

# Harness-internal unique model id.
id = 'provider/model-name'

# Optional. Declarative selection guidance, surfaced in the boot event's
# available-models menu — helps the agent choose substrates without
# a-priori knowledge of their strengths/weaknesses.
guidance = 'example: fast and cheap, multimodal — default for presence and visual work'

# Supported adapters: 'openai' (any OpenAI-compatible inference provider)
# and 'anthropic' (direct API with explicit prompt caching).
adapter = 'openai'

# The provider-side model name and credentials.
options.model = "provider/model-name"
options.api_key = "${PROVIDER_API_KEY}"
# Optional. Override the default base URL for OpenAI-compatible providers.
options.base_url = 'https://api.provider.example/v1'
# Optional. Reasoning effort for reasoning-capable models.
# options.reasoning.effort = 'high'
# Optional. Replay reasoning traces back to the model on follow-ups.
# replay_thinking = true
# Extra options passed to the inference provider at query time.
# Use for provider-specific options such as `provider` selection
# criteria for OpenRouter. This is an OPEN region: keys here are
# passed through as-is.
# options.extras = {}

# Output token budget per activation.
max_output_size = 20000
# Context window of the model.
max_context_size = 1000000
# Stall timeout for model queries, in milliseconds. The timer measures
# SILENCE, not total duration: it re-arms on every stream chunk received
# from the provider, so long-running or slow-thinking queries are never
# killed while healthy — only a connection that goes silent for this
# long is aborted.
timeout = 60000

# Input modalities the model supports. Enable images to let the agent
# see photos (e.g. those downloaded via the telegram package's photo
# tool); audio to project voice notes as native audio input.
# modalities.images = true
# modalities.audio = true

# ─────────────────────────────────────────────────────────────────────────────
# Dedicated models below are STATIC — deliberately NOT part of the
# switchable session array.
# ─────────────────────────────────────────────────────────────────────────────

# Dedicated distillation model (continuity-record maintenance).
# Distillation quality compounds, so it deserves a strong model
# regardless of what substrate a session has switched to.
[models.distillation]
id = 'distillation'
adapter = 'openai'
options.model = "provider/model-name"
options.api_key = "${PROVIDER_API_KEY}"
options.base_url = 'https://api.provider.example/v1'
max_output_size = 20000
max_context_size = 1000000
timeout = 60000

# Dedicated compaction model. Same reasoning as distillation.
[models.compaction]
id = 'compaction'
adapter = 'openai'
options.model = "provider/model-name"
options.api_key = "${PROVIDER_API_KEY}"
options.base_url = 'https://api.provider.example/v1'
max_output_size = 20000
max_context_size = 1000000
timeout = 60000

# Embedding model: computes vector representations of continuity
# records and similarity queries.
[models.embedding]
adapter = 'openai'
options.model = 'provider/embedding-model'
options.api_key = "${PROVIDER_API_KEY}"
options.base_url = 'https://api.provider.example/v1'
# Optional. Vector dimensionality produced by this model. The continuity
# store's embedding column is aligned to this at every boot (null-and-
# rebuild on mismatch — plan for re-embedding when changing models).
# options.dimensions = 1536

# Optional. Transcription (speech-to-text) model — OpenAI-compatible
# API. Enables voice-note transcription (e.g. Telegram voice messages).
# [models.transcription]
# adapter = 'openai'
# options.model = 'whisper-1'
# options.base_url = 'http://127.0.0.1:8178/v1'
# Optional. Prompt biases the transcription vocabulary.
# options.prompt = 'Names, places, and jargon the agent encounters often.'

# Optional. Synthesis (text-to-speech) model — OpenAI-compatible API.
# Enables outgoing voice notes (e.g. via the telegram package).
# [models.synthesis]
# adapter = 'openai'
# options.model = 'kokoro-v1.0'
# options.base_url = 'http://127.0.0.1:8179/v1'
# options.voice = 'bm_fable'

# Optional. Recollection extractor: gates and focuses recollection
# queries. Small and fast is the point — it runs on every query.
# When absent, the recaller performs no automatic recollection at all
# (zero injections) — grounding remains the agent's conscious work
# via continuity queries.
# [models.extraction]
# id = 'provider/small-model'
# adapter = 'openai'
# options.model = 'provider/small-model'
# options.api_key = "${PROVIDER_API_KEY}"
# options.base_url = 'https://api.provider.example/v1'
# max_output_size = 4096
# max_context_size = 32768
# timeout = 2500

# =============================================================================
#                                  SESSION
# =============================================================================

# Optional. Session-run management. Defaults apply when absent.
# [session]

# Optional. Cap on activations per run before a fresh run is started.
# max_activations_per_run = 500

# =============================================================================
#                                   FILES
# =============================================================================

# Optional. Temp-file management. Defaults apply when absent.
# [files]

# Optional. Root directory for expiring temp files.
# Defaults to <cwd>/media/tmp.
# temp_dir = "/var/lib/loom/media/tmp"

# Optional. Cleanup sweep interval in milliseconds. Default 60000.
# cleanup_interval_ms = 60000
