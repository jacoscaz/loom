# Example configuration file for Loom.
#
# Usage: node packages/harness/dist/server.js config.toml
#
# String values using the "${VAR}" placeholder syntax will be replaced with
# the referenced environment variable (from .env or the process environment).
# See .env-example for the variables referenced below.
#
# Validation: the loader casts the parsed config against the Config type and
# diffs the result against the raw parse — any key silently stripped by
# validation is a boot ERROR naming the exact path. Unknown keys are rejected
# everywhere EXCEPT the open regions of the type (e.g. the model's
# `options.extras` block, where adapter-specific payloads ride by design).
#
# Style discipline: use dotted keys (options.model = ...) rather than
# sub-table headers like [model.options].

# =============================================================================
#                               GENERAL OPTIONS
# =============================================================================

# Optional. Pid file backing the single-instance guard: the first thing
# the harness does at boot is check this file. A second instance finding
# a live pid file exits immediately instead of racing the first for the
# database and the Telegram bot. A stale file (recorded pid dead, or
# corrupt contents — e.g. after a hard kill or power loss) is reclaimed
# with a warning, so a crash can never wedge subsequent boots.
# Defaults to harness.pid at the level of the harness package.json.
# pid_file = "/path/to/harness.pid"

# =============================================================================
#                                  LOGGING
# =============================================================================

[logging]

# Logging level.
# Supported values: "trace", "debug", "info", "warn", "error"
level = "info"

# Optional. Whether to prefix log messages with a (date)timestamp.
# Defaults to true.
datetime = false

# =============================================================================
#                                  POSTGRES
# =============================================================================

# Conversation history: one row per message, grouped by session (one
# session per Telegram chat). Incoming messages are stored before the
# Telegram update is confirmed, and sessions with unprocessed messages are
# resumed at boot, so nothing is lost across crashes and restarts.

[postgres]

hostname = "${POSTGRES_HOSTNAME}"
port = "${POSTGRES_PORT}"
database = "${POSTGRES_DATABASE}"
username = "${POSTGRES_USERNAME}"
password = "${POSTGRES_PASSWORD}"

# Optional. Schema holding the harness' tables, created at boot if missing.
# Defaults to the connection's search_path (usually "public"). The schema
# is NOT compatible with the one of the pre-refactor harness: when reusing
# a database that holds old data, set a dedicated schema here.
schema = "harness"

# =============================================================================
#                                  TELEGRAM
# =============================================================================

[telegram]

# Telegram Bot API integration. Each Telegram chat is a separate session
# ("telegram:<chat_id>") with its own history.

# A bot token is obtained from @BotFather.
api_token = "${TELEGRAM_API_TOKEN}"

# Optional but strongly recommended. Telegram user ids allowed to talk to
# the agent; messages from anyone else are dropped. When absent, anyone
# who finds the bot can talk to it.
# allowed_user_ids = [123456789]

# Optional. Long-poll interval in seconds for getUpdates (Telegram timeout).
poll_timeout_seconds = 30

# Optional. Directory where media downloaded via the telegram_file tool is
# stored. Defaults to <cwd>/media/telegram.
# media_dir = "/var/lib/loom/media/telegram"

# =============================================================================
#                                   MODEL
# =============================================================================

# The completion model driving the agent, queried through @loom/models.

[model]

# Supported adapters: 'anthropic' (direct API with explicit prompt
# caching), 'openai' (any OpenAI-compatible inference provider) and
# 'tensorx'.
adapter = 'anthropic'

# Provider-side model name and credentials.
options.model = "claude-opus-5-5"
options.api_key = "${ANTHROPIC_API_KEY}"
# Optional. Override the provider's default base URL.
# options.base_url = 'https://api.provider.example/v1'

# Output token budget per model query.
options.max_output_size = 20000
# Context window of the model.
options.max_context_size = 200000
# Stall timeout for model queries, in milliseconds. The timer measures
# SILENCE, not total duration: it re-arms on every stream chunk received
# from the provider, so long-running or slow-thinking queries are never
# killed while healthy — only a connection that goes silent for this
# long is aborted.
options.timeout = 60000

# Optional. Input modalities the model supports. Enable images to let the
# agent see photos sent over Telegram; audio to receive voice notes as
# native audio input (voice notes are not transcribed otherwise).
# options.modalities.images = true
# options.modalities.audio = true

# Optional. Replay reasoning traces back to the model on follow-ups.
# True for DeepSeek and Anthropic, false for most others.
# options.replay_thinking = true

# Optional, 'anthropic' only. Prompt-caching TTL: '5m', '1h' or 'off'.
# options.prompt_cache_ttl = '1h'

# Optional, 'openai'/'tensorx' only. Reasoning effort for reasoning-capable
# models: 'none', 'minimal', 'low', 'medium', 'high' or 'xhigh'.
# options.reasoning_effort = 'high'

# Optional. Extra options passed to the inference provider at query time,
# e.g. `provider` selection criteria for OpenRouter. This is an OPEN
# region: keys here are passed through as-is.
# options.extras = {}

# Example: an OpenAI-compatible provider (here OpenRouter) instead.
# adapter = 'openai'
# options.model = "provider/model-name"
# options.api_key = "${OPENROUTER_API_KEY}"
# options.base_url = 'https://openrouter.ai/api/v1'

# =============================================================================
#                                   AGENT
# =============================================================================

# Optional. Defaults apply when absent.
# [agent]

# Optional. Replaces the built-in system prompt (see
# packages/harness/src/prompt.ts). It must tell the agent to reply through
# the telegram_send_text tool: its plain-text output reaches nobody.
# system_prompt = "..."

# Optional. Maximum number of model queries per turn: bounds the cost of a
# runaway tool-calling loop. Default 16.
# max_steps_per_turn = 16
